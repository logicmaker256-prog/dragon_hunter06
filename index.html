<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ドラゴンハンター - スタート</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #000;
    touch-action: none; -webkit-user-select: none; user-select: none;
    font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
  }
  #loadingScreen {
    position: fixed; inset:0; background:#0a0e17; color:#dfe6ff;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size: 15px; letter-spacing: 1px;
  }
  #titleChoice {
    display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 18px;
  }
  #titleChoice button {
    font-size: 14px; font-weight: bold; border: none; border-radius: 22px;
    padding: 11px 30px; letter-spacing: 1px; box-shadow: 0 3px 8px rgba(0,0,0,0.5);
    -webkit-tap-highlight-color: transparent;
  }
  #titleNewGameBtn { background: #8fe0ff; color: #062a33; }
  #titleLoadBtn { background: #ffe9a8; color: #3a2a00; }
  #titleLoadErrorText {
    display: none; font-size: 12px; color: #ff8c8c; text-align: center; max-width: 260px;
  }

  /* ---------- ユーザーGLB選択(勇者/メイドモデルを外部GLBに差し替え) ---------- */
  #titleGlbCustomLabel {
    font-size: 11px; color: rgba(223,230,255,0.65); margin-top: 8px; letter-spacing: 1px;
  }
  #glbSelectWrap, #maidGlbSelectWrap, #villagerGlbSelectWrap {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  #glbSelectBtn { background: rgba(80,70,150,0.85); color: #fff; }
  #maidGlbSelectBtn { background: rgba(150,90,60,0.85); color: #fff; }
  #villagerGlbSelectBtn { background: rgba(70,120,90,0.85); color: #fff; }
  #glbSelectBtn:active, #maidGlbSelectBtn:active, #villagerGlbSelectBtn:active { filter: brightness(1.3); }
  #glbStatusText, #maidGlbStatusText, #villagerGlbStatusText {
    font-size: 10px; color: #fff; text-shadow: 1px 1px 2px #000;
    background: rgba(0,0,0,0.45); border-radius: 8px; padding: 2px 8px;
    max-width: 220px; word-break: break-word; display: none;
  }
</style>
</head>
<body>

<div id="loadingScreen">
  <div id="loadingText">プレイ方法を選んでください</div>
  <div id="titleChoice">
    <button id="titleNewGameBtn">⚔️ はじめから</button>
    <button id="titleLoadBtn">📂 セーブデータをロード</button>
    <div id="titleLoadErrorText"></div>

    <div id="titleGlbCustomLabel">キャラクターを変更する(任意)</div>
    <div id="glbSelectWrap">
      <button id="glbSelectBtn">🧍 キャラクターGLB</button>
      <div id="glbStatusText"></div>
    </div>
    <input type="file" id="glbFileInput" accept=".glb" style="display:none">
    <div id="maidGlbSelectWrap">
      <button id="maidGlbSelectBtn">🧺 メイドGLB</button>
      <div id="maidGlbStatusText"></div>
    </div>
    <input type="file" id="maidGlbFileInput" accept=".glb" style="display:none">
    <!-- ゲストハウス・領民システム: 領民モデル(ryou.glb)。勇者/メイドと同じ方式で
         任意選択させ、TransferDB経由でgame.htmlへ引き継ぐ(固定埋め込みはしない)。 -->
    <div id="villagerGlbSelectWrap">
      <button id="villagerGlbSelectBtn">🧑‍🌾 領民GLB (ryou.glb)</button>
      <div id="villagerGlbStatusText"></div>
    </div>
    <input type="file" id="villagerGlbFileInput" accept=".glb" style="display:none">
  </div>
</div>
<input type="file" id="saveFileInputTitle" accept=".json,application/json" style="display:none">

<script src="js/transfer-db.js"></script>
<script>
/* ---------------------------------------------------------------------
   タイトル画面(index.html)専用スクリプト。
   Three.js等ゲーム本編の重い処理は一切持たず、以下だけを行う:
   1) ユーザーが任意で選んだ勇者/メイドGLBをTransferDB(IndexedDB)へ保存
   2) 「はじめから」/「セーブデータをロード」の選択結果をsessionStorageへ保存
   3) game.htmlへ遷移(実際のゲーム開始処理はgame.html側で行う)
--------------------------------------------------------------------- */
const USER_GLB_MAX_BYTES = 200 * 1024 * 1024; // game.html側の上限と合わせる

function setStatusText(el, msg, isError) {
  if (!el) return;
  if (!msg) { el.style.display = 'none'; el.textContent = ''; return; }
  el.style.display = 'block';
  el.textContent = msg;
  el.style.color = isError ? '#ff8c8c' : '#ffffff';
}

function bindGlbPicker(fileInputId, btnId, statusElId, dbKey) {
  const fileInput = document.getElementById(fileInputId);
  const btn = document.getElementById(btnId);
  const statusEl = document.getElementById(statusElId);

  if (btn && fileInput) {
    btn.addEventListener('click', () => fileInput.click());
  }
  if (!fileInput) return;

  fileInput.addEventListener('change', () => {
    const file = fileInput.files && fileInput.files[0];
    fileInput.value = ''; // 同じファイルを連続選択してもchangeが発火するようにリセット
    if (!file) return;

    const lowerName = (file.name || '').toLowerCase();
    if (!lowerName.endsWith('.glb')) {
      setStatusText(statusEl, '.glb形式のファイルを選択してください', true);
      return;
    }
    if (file.size > USER_GLB_MAX_BYTES) {
      setStatusText(statusEl, 'ファイルサイズが大きすぎるため読み込めませんでした', true);
      return;
    }

    setStatusText(statusEl, '読み込み中…');
    Promise.resolve().then(() => file.arrayBuffer())
      .then((buffer) => TransferDB.set(dbKey, buffer))
      .then(() => {
        setStatusText(statusEl, `選択済み: ${file.name}`);
      })
      .catch((err) => {
        console.error('GLBファイルの読み込みに失敗しました:', err);
        setStatusText(statusEl, 'GLB読み込みに失敗しました', true);
      });
  });
}

bindGlbPicker('glbFileInput', 'glbSelectBtn', 'glbStatusText', 'heroGlbBuffer');
bindGlbPicker('maidGlbFileInput', 'maidGlbSelectBtn', 'maidGlbStatusText', 'maidGlbBuffer');
// ゲストハウス・領民システム: 領民GLB(ryou.glb)。既存のbindGlbPicker()をそのまま再利用する。
bindGlbPicker('villagerGlbFileInput', 'villagerGlbSelectBtn', 'villagerGlbStatusText', 'villagerGlbBuffer');

const titleNewGameBtn = document.getElementById('titleNewGameBtn');
const titleLoadBtn = document.getElementById('titleLoadBtn');
const saveFileInputTitle = document.getElementById('saveFileInputTitle');
const titleLoadErrorTextEl = document.getElementById('titleLoadErrorText');

// 「はじめから」: モードだけ記録してゲーム画面へ(実際の開始処理はgame.html側)
titleNewGameBtn.addEventListener('click', () => {
  sessionStorage.setItem('dh_startMode', 'new');
  location.href = 'game.html';
});

// 「セーブデータをロード」: ファイル選択ダイアログを開く
titleLoadBtn.addEventListener('click', () => {
  setStatusText(titleLoadErrorTextEl, '');
  saveFileInputTitle.click();
});

saveFileInputTitle.addEventListener('change', () => {
  const file = saveFileInputTitle.files && saveFileInputTitle.files[0];
  saveFileInputTitle.value = '';
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    // ここではJSONの妥当性チェックは行わない(game.html側の既存チェックに委ねる)。
    // テキストのままTransferDBへ保存し、game.htmlで解析・検証・適用する。
    TransferDB.set('pendingSaveText', reader.result).then(() => {
      sessionStorage.setItem('dh_startMode', 'load');
      location.href = 'game.html';
    }).catch((err) => {
      console.error('セーブデータの引き継ぎに失敗しました:', err);
      setStatusText(titleLoadErrorTextEl, 'セーブデータの読み込みに失敗しました', true);
    });
  };
  reader.onerror = () => {
    console.error('セーブデータファイルの読込に失敗しました:', reader.error);
    setStatusText(titleLoadErrorTextEl, 'セーブデータの読み込みに失敗しました', true);
  };
  reader.readAsText(file);
});

// game.html側でセーブデータの読み込みに失敗し、このページへ戻された場合の表示
(function () {
  const params = new URLSearchParams(location.search);
  if (params.get('loaderror') === '1') {
    setStatusText(titleLoadErrorTextEl, 'セーブデータの読み込みに失敗しました。もう一度お試しください。', true);
    history.replaceState(null, '', location.pathname);
  }
})();
</script>
</body>
</html>
